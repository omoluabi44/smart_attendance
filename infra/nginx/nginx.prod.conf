# ============================================================================
# FacePass Production Nginx Reverse Proxy Configuration
# Routes:
#   - https://face.coursepass.app/api/v1/*  -> facepass_api:5001 (Flask/Gunicorn)
#   - https://face.coursepass.app/*         -> facepass_web:3000 (Next.js 15)
# ============================================================================

upstream facepass_web_upstream {
    server facepass_web:3000;
    keepalive 32;
}

upstream facepass_api_upstream {
    server facepass_api:5001;
    keepalive 32;
}

# 1. HTTP Server (Port 80): Let's Encrypt ACME Challenge & HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name facepass.coursepass.app face.coursepass.app;

    server_tokens off;

    # Allow Certbot ACME HTTP-01 challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Port 443): TLS 1.2 / 1.3 + Reverse Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name facepass.coursepass.app face.coursepass.app;

    server_tokens off;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/facepass.coursepass.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facepass.coursepass.app/privkey.pem;

    # TLS 1.3 & 1.2 Hardening (PRD Security Rule #4)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security & WebRTC Camera Permission Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    # Allow high-res group photos / course material uploads
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ─── Backend API Routes (/api/v1/*) ──────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://facepass_api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Keepalive Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Extended timeouts for AWS Rekognition group photo detection & search
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── Swagger / OpenAPI Documentation Routes ──────────────────────────────
    location ~ ^/(apidocs|flasgger_static|apispec_1\.json) {
        proxy_pass http://facepass_api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Next.js Frontend Routes (/) ─────────────────────────────────────────
    location / {
        proxy_pass http://facepass_web_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
