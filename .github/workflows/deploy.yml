name: FacePass Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build & Push Frontend Image (Next.js)
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_USERNAME && 'docker.io' || 'ghcr.io' }}
          username: ${{ secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Set Docker Tag
        id: meta
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "tag=${{ secrets.DOCKER_USERNAME }}/facepass-web:latest" >> "$GITHUB_OUTPUT"
          else
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "tag=ghcr.io/${OWNER_LC}/facepass-web:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./facepass-web
          file: ./facepass-web/dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://face.coursepass.app/api/v1/
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Build & Push Backend Image (Flask + Celery)
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_USERNAME && 'docker.io' || 'ghcr.io' }}
          username: ${{ secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Set Docker Tag
        id: meta
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "tag=${{ secrets.DOCKER_USERNAME }}/facepass-backend:latest" >> "$GITHUB_OUTPUT"
          else
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "tag=ghcr.io/${OWNER_LC}/facepass-backend:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Deploy to EC2 via SSH (CoursePass Pattern)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-ec2:
    name: Deploy to EC2
    needs: [build-and-push-frontend, build-and-push-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP || secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.EC2_USERNAME || secrets.EC2_USER || secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: 22
          script: |
            set -e

            # 1. Clone repository on first run, or update existing checkout
            if [ ! -d ~/facepass ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ~/facepass
            fi
            cd ~/facepass
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master

            # 2. Setup production environment file from GitHub secret (CoursePass pattern)
            echo "${{ secrets.ENV_FILE || secrets.BACKEND_ENV_FILE }}" > .env.prod
            cp .env.prod .env
            cp .env.prod Backend/.env
            chmod 600 .env.prod .env Backend/.env

            # 3. Authenticate with GHCR if Docker Hub is not configured
            if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
              OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              export WEB_IMAGE="ghcr.io/${OWNER_LC}/facepass-web:latest"
              export API_IMAGE="ghcr.io/${OWNER_LC}/facepass-backend:latest"
            else
              export WEB_IMAGE="${{ secrets.DOCKER_USERNAME }}/facepass-web:latest"
              export API_IMAGE="${{ secrets.DOCKER_USERNAME }}/facepass-backend:latest"
            fi

            # 4. Ensure Certbot directories and bootstrap certificate exist
            mkdir -p certbot/conf certbot/www
            if [ ! -f "certbot/conf/live/face.coursepass.app/fullchain.pem" ]; then
              echo ">>> Creating bootstrap self-signed SSL certificate for initial Nginx startup..."
              mkdir -p certbot/conf/live/face.coursepass.app
              openssl req -x509 -nodes -newkey rsa:2048 -days 7 \
                -keyout certbot/conf/live/face.coursepass.app/privkey.pem \
                -out certbot/conf/live/face.coursepass.app/fullchain.pem \
                -subj "/CN=face.coursepass.app"
            fi

            # 5. Stop host web servers that might block ports 80/443
            sudo systemctl stop apache2 2>/dev/null || true
            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable apache2 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true

            # 6. Restart containers
            sudo docker compose -f docker-compose.prod.yml down || sudo docker-compose -f docker-compose.prod.yml down || true
            sudo docker image prune -af
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d

            # 7. Check API Healthcheck
            echo ">>> Verifying FacePass API health..."
            for i in {1..15}; do
              if sudo docker compose -f docker-compose.prod.yml exec -T facepass_api curl -sf http://127.0.0.1:5001/api/v1/health; then
                echo ">>> FacePass API is healthy!"
                break
              fi
              echo "Waiting for API ($i/15)..."
              sleep 4
            done

            # 8. Auto-renew certificates if due & reload Nginx
            sudo docker compose -f docker-compose.prod.yml run --rm certbot renew --webroot -w /var/www/certbot --quiet || true
            sudo docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
